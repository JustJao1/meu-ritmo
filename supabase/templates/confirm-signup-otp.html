<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirme seu cadastro no Meu Ritmo</title></head>
<body style="margin:0;padding:32px 16px;background:#f5f6f8;font-family:Arial,Helvetica,sans-serif;color:#20232a;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;padding:32px 28px;">
    <div style="font-size:18px;line-height:1.3;font-weight:700;letter-spacing:-.3px;">MR: Meu Ritmo</div>
    <h1 style="font-size:23px;margin:28px 0 14px;line-height:1.25;">Confirme seu e-mail</h1>
    <p style="font-size:15px;line-height:1.6;margin:0 0 20px;">Use o código abaixo para concluir seu cadastro no Meu Ritmo.</p>
    <div style="background:#f3f4f6;border-radius:8px;text-align:center;padding:20px 12px;font-size:30px;font-weight:700;letter-spacing:8px;font-family:Arial,Helvetica,sans-serif;">{{ .Token }}</div>
    <p style="font-size:14px;line-height:1.6;margin:20px 0 0;">Volte à página de confirmação do Meu Ritmo e digite esse código. Ele é temporário e só pode ser utilizado uma vez.</p>
    <p style="font-size:13px;line-height:1.6;color:#6b7280;margin:18px 0 0;">Se você não criou uma conta, ignore esta mensagem.</p>
  </div>
</body>
</html>
