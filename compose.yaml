services:
  app:
    build: .
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      ASAAS_BILLING_ENABLED: "false"
      BILLING_TEST_ENABLED: "false"
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:4173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
