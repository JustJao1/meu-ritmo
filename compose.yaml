services:
  app:
    build: .
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      ASAAS_BILLING_ENABLED: "false"
      BILLING_TEST_ENABLED: "false"
    healthcheck:
      test: ["CMD","node","-e","require('node:http').get('http://127.0.0.1:4173/entrar',r=>{r.destroy();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
