name: Verificar Asaas Sandbox
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate_sandbox:
    name: Verificar chave de testes (sem cobranças)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: sandbox
    steps:
      - name: Validar ambiente e consultar API somente para leitura
        env:
          ASAAS_MODE: ${{ vars.ASAAS_MODE }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const mode=process.env.ASAAS_MODE;
          const key=process.env.ASAAS_API_KEY||'';
          function fail(message) {
            console.error('Sandbox: '+message);
            process.exitCode=1;
          }
          if(mode!=='sandbox'){
            fail('A variável ASAAS_MODE do ambiente sandbox precisa ser exatamente "sandbox". Nenhuma requisição foi enviada.');
          }else if(!key){
            fail('Chave não encontrada. Cadastre ASAAS_API_KEY em Settings > Environments > sandbox > Environment secrets. Nenhuma requisição foi enviada.');
          }else if(!key.startsWith('$aact_hmlg_')){
            fail('A chave informada não tem o prefixo de Sandbox. Não use a chave de produção. Nenhuma requisição foi enviada.');
          }else{
            try{
              const response=await fetch('https://api-sandbox.asaas.com/v3/customers?limit=1',{
                method:'GET',
                headers:{access_token:key,accept:'application/json','User-Agent':'MeuRitmo-Sandbox-Validation/1.0'},
                signal:AbortSignal.timeout(15000)
              });
              if(response.ok){
                console.log('OK: autenticação com o Asaas Sandbox aprovada. Nenhuma cobrança foi criada ou modificada.');
              }else{
                fail('O Asaas Sandbox respondeu HTTP '+response.status+'. Verifique a chave de testes e suas permissões.');
              }
            }catch{
              fail('Não foi possível conectar ao Asaas Sandbox. Verifique a rede ou tente novamente.');
            }
          }
          NODE
