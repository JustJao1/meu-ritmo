name: Recuperar fila do webhook Asaas Sandbox após deploy seguro
on:
  workflow_run:
    workflows: ["Publicar Meu Ritmo Sandbox (isolado)"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resume_sandbox:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha) }}
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar Worker, esquema D1 e retomar somente fila Sandbox
        env:
          ASAAS_MODE: ${{ vars.ASAAS_MODE }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SANDBOX_D1_DATABASE_ID: ${{ vars.SANDBOX_D1_DATABASE_ID }}
          PRODUCTION_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/asaas-sandbox-resume-webhook.mjs
