name: Atualizar Meu Ritmo independente
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código publicado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo clone "$GITHUB_REPOSITORY" source -- --depth=2
      - name: Conferir base e aplicar atualização
        env:
          SOURCE0: 
          SOURCE1: 
          SOURCE2: 
          SOURCE3: 
        working-directory: source
        run: |
          test "$(git rev-parse HEAD^)" = "d4f5aec78d8e9c308561fa38999277a0aa397345"
          python3 - <<'PYCODE'
          import base64,gzip,hashlib,pathlib,os
          patch=gzip.decompress(base64.b64decode(''.join(os.environ[k] for k in sorted(os.environ) if k.startswith('SOURCE'))))
          assert hashlib.sha256(patch).hexdigest()=='4e71f44dfbe66d16e15032154ac5f849fd95ed7757945df938704039742e7f54'
          pathlib.Path('/tmp/migration.patch').write_bytes(patch)
          PYCODE
          git apply --index /tmp/migration.patch
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar código
        working-directory: source
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Publicar código validado
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git config user.name "João Victor"
          git config user.email "284127765+JustJao1@users.noreply.github.com"
          git commit -m "Independência de hospedagem, login próprio e central de alarmes"
          git push origin HEAD:main
