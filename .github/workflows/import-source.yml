name: Importar código e publicar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-source.yml']
permissions:
  contents: write
concurrency:
  group: ritmo-initial-import
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'JustJao1/meu-ritmo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Importar origem verificada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYTHON'
          import os,sys,json,hashlib,urllib.request,urllib.error,zipfile,tempfile,pathlib,subprocess,shutil,stat
          repo=os.environ['GITHUB_REPOSITORY']
          assert repo == 'JustJao1/meu-ritmo'
          root=pathlib.Path(tempfile.mkdtemp(prefix='ritmo-import-'))
          token=os.environ['GH_TOKEN']
          ask=root/'askpass.sh'
          ask.write_text('#!/bin/sh\ncase "$1" in *Username*) printf "%s\\n" x-access-token;; *Password*) printf "%s\\n" "$GH_TOKEN";; esac\n')
          ask.chmod(0o700)
          env=os.environ.copy();env.update(GIT_ASKPASS=str(ask),GIT_TERMINAL_PROMPT='0')
          def git(*args):
           return subprocess.check_output(['git',*args],cwd=dest,env=env,text=True).strip()
          dest=root/'repository'
          subprocess.run(['git','clone','--depth','1','https://github.com/'+repo+'.git',str(dest)],env=env,check=True)
          marker=dest/'.github/import-completed.json'
          if not marker.exists():
           allowed={'README.md','.github/workflows/import-source.yml'}
           unexpected=set(git('ls-files').splitlines())-allowed
           if unexpected:raise RuntimeError('Importação interrompida: já existem outros arquivos no repositório.')
           url='https://meu-ritmo-lite.tonedcamel16.chatgpt.site/source/meu-ritmo-source.zip'
           req=urllib.request.Request(url,headers={'User-Agent':'Meu-Ritmo-source-import/1.0'})
           with urllib.request.urlopen(req,timeout=90) as r:data=r.read(10000000)
           assert hashlib.sha256(data).hexdigest()=='c613c2208da568918a47721058b9fa391ddb1af64bd85ee701add237dc002fb7','Hash da origem não confere'
           archive=root/'source.zip';archive.write_bytes(data)
           with zipfile.ZipFile(archive) as z:
            assert len(z.infolist())<1000
            for info in z.infolist():
             rel=pathlib.PurePosixPath(info.filename)
             assert not rel.is_absolute() and '..' not in rel.parts
             assert not stat.S_ISLNK(info.external_attr>>16)
             assert rel.suffix not in {'.keystore','.jks','.pem','.key','.sqlite','.db'}
             assert not (rel.name.startswith('.env') and rel.name!='.env.example')
            z.extractall(dest)
           marker.parent.mkdir(exist_ok=True)
           marker.write_text(json.dumps({'sourceSha256':'c613c2208da568918a47721058b9fa391ddb1af64bd85ee701add237dc002fb7','importedFiles':len(z.infolist()),'version':'0.1.1-dev' if repo.endswith('-lite') else 'initial'},indent=2)+'\n')
           git('config','user.name','github-actions[bot]')
           git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
           git('add','--all')
           git('commit','-m','Publica o código completo do meu-ritmo')
           git('push','origin','HEAD:main')
           print('Código importado:',git('rev-parse','HEAD'))
          else:
           assert json.loads(marker.read_text())['sourceSha256']=='c613c2208da568918a47721058b9fa391ddb1af64bd85ee701add237dc002fb7'
           print('Código já importado; nenhuma alteração local sobrescrita.')
          PYTHON
