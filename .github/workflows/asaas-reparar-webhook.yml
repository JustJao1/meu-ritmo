name: Reparar eventos do webhook Asaas Sandbox
on:
  push:
    branches: [main]
    paths:
      - 'scripts/asaas-sandbox-repair-webhook.mjs'
      - '.github/workflows/asaas-reparar-webhook.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair_sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Adicionar eventos ausentes ao webhook existente
        env:
          ASAAS_MODE: ${{ vars.ASAAS_MODE }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
        run: node scripts/asaas-sandbox-repair-webhook.mjs
