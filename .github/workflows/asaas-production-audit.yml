name: Auditar cadastros e chaves Asaas de produção
on:
  push:
    branches: [main]
    paths:
      - 'scripts/asaas-production-audit.mjs'
      - '.github/workflows/asaas-production-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit_prod:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar registro dos segredos e configurações sem realizar cobranças
        env:
          ASAAS_MODE: ${{ vars.ASAAS_MODE }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          ASAAS_WEBHOOK_READY: ${{ vars.ASAAS_WEBHOOK_READY }}
          # Espelhar os valores efetivos do workflow deploy.yml, não variáveis legadas.
          ASAAS_BILLING_ENABLED: 'true'
          ASAAS_CARD_CHECKOUT_ENABLED: 'false'
          ASAAS_PRODUCTION_CARD_APPROVED: 'false'
          EARLY_ACCESS_ENABLED: 'false'
        run: node scripts/asaas-production-audit.mjs
