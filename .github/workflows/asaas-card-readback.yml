name: Conferir resultado persistido de cartões no Asaas Sandbox
on:
  push:
    branches: [main]
    paths:
      - 'scripts/asaas-card-readback-audit.mjs'
      - '.github/workflows/asaas-card-readback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Conferir status atual das cobranças sintéticas já criadas
        env:
          ASAAS_MODE: ${{ vars.ASAAS_MODE }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
        run: node scripts/asaas-card-readback-audit.mjs
