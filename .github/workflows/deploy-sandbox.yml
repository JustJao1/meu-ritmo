name: Publicar Meu Ritmo Sandbox (isolado)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    name: Publicar homologação separada
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Publicar somente Worker, D1 e credenciais de homologação
        run: node scripts/deploy-sandbox.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PRODUCTION_SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
          SANDBOX_D1_DATABASE_ID: ${{ vars.SANDBOX_D1_DATABASE_ID }}
          SANDBOX_SUPABASE_URL: ${{ secrets.SANDBOX_SUPABASE_URL }}
          SANDBOX_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SANDBOX_SUPABASE_PUBLISHABLE_KEY }}
          SANDBOX_SESSION_ENCRYPTION_KEY: ${{ secrets.SANDBOX_SESSION_ENCRYPTION_KEY }}
          SANDBOX_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SANDBOX_SUPABASE_SERVICE_ROLE_KEY }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_MODE: ${{ vars.ASAAS_MODE }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.SANDBOX_ASAAS_WEBHOOK_TOKEN }}
          ASAAS_WEBHOOK_READY: ${{ vars.SANDBOX_ASAAS_WEBHOOK_READY || 'false' }}
          ASAAS_BILLING_ENABLED: ${{ vars.SANDBOX_ASAAS_BILLING_ENABLED || 'false' }}
