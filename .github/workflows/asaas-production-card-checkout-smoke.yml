name: Verificar Checkout de cartão Asaas sem pagamento
on:
  push:
    branches: [main]
    paths:
      - 'scripts/asaas-production-card-checkout-smoke.mjs'
      - '.github/workflows/asaas-production-card-checkout-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  card:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Criar e cancelar checkout seguro sem inserir dados de cartão
        env:
          ASAAS_MODE: ${{ vars.ASAAS_MODE }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
        run: node scripts/asaas-production-card-checkout-smoke.mjs
