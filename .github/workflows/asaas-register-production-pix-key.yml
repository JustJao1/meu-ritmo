name: Configurar chave Pix aleatória Asaas produção
on:
  push:
    branches: [main]
    paths:
      - 'scripts/asaas-register-production-pix-key.mjs'
      - '.github/workflows/asaas-register-production-pix-key.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  register_key:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cadastrar somente uma EVP quando não houver chave
        env:
          ASAAS_MODE: ${{ vars.ASAAS_MODE }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
        run: node scripts/asaas-register-production-pix-key.mjs
